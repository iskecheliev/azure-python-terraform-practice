# Run on pushes to main
trigger:
  branches:
    include:
      - main

# Run on PRs that target main
pr:
  branches:
    include:
      - main

# Which agents may run this job
pool:
  name: Self-Hosted-Linux
  demands:
    - Agent.Name -equals hyper-v-dev-agent

variables:
  TF_VERSION: '1.12.2'

steps:
  - checkout: self

  - script: |
      curl -sSLo terraform.zip https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip
      python3 -m zipfile -e terraform.zip $(Agent.TempDirectory)/tf
      chmod +x $(Agent.TempDirectory)/tf/terraform
      echo "##vso[task.prependpath]$(Agent.TempDirectory)/tf"
    displayName: 'Install Terraform $(TF_VERSION)'

  - script: terraform version
    displayName: 'Show Terraform version'

  - script: terraform fmt -check -recursive
    displayName: 'Terraform format check'

  - script: |
      terraform init -backend=false
      terraform validate
    workingDirectory: lesson2_terraform
    displayName: 'Terraform validate'

  - script: python3 -m py_compile lesson1_sdk_blob/*.py lesson2_python/*.py
    displayName: 'Python syntax check'

  - task: AzureCLI@2
    displayName: 'Terraform plan'
    inputs:
      azureSubscription: 'sc-azure-course'          # hint: the service connection's name
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      addSpnToEnvironment: true         # hands the identity's details to the script
      workingDirectory: lesson2_terraform             # hint: same folder as the validate step
      inlineScript: |
        export ARM_CLIENT_ID=$servicePrincipalId
        export ARM_TENANT_ID=$tenantId
        export ARM_OIDC_TOKEN=$idToken
        export ARM_USE_OIDC=true
        export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
        export TF_VAR_blob_user_principal_id=$(blobUserPrincipalId)
        terraform init -input=false
        terraform plan -input=false